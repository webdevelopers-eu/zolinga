<html lang="zh-CN">

<head>

<!-- TRANSLATORS: Context for all strings below. This page is shown to humans who accidentally open the /mcp/ URL in a browser. The /mcp/ endpoint is a machine-to-machine API gateway (Model Context Protocol) where AI assistants (software like Copilot, Claude) connect to our servers programmatically. There is nothing for a human to see or do here. The page reassures the visitor and auto-redirects to the home page after 180 seconds. Tone: calm, informative, non-alarming. The visitor did nothing wrong. -->
<body gettext-context-adjacent="3">
    <div class="card">
        <div class="icon">
            <svg viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"></path>
                <path d="M0 0h24v24H0z" fill="none"></path>
            </svg>
        </div>
        <!-- TRANSLATORS: Page heading. "AI Agent" = a software program that performs tasks autonomously (not a human agent). "Gateway" = an entry point / portal. Together: the technical endpoint where AI software connects. Keep it short, like a page title. -->
        <h1 gettext="system:.#27cab6">AI 代理网关</h1>
        <!-- TRANSLATORS: Subtitle. "Secure channel" = an encrypted API connection, not a chat. "AI assistants" = software programs like Copilot or Claude, not human assistants. "Built for machines, not browsers" = designed for programs, not web browsers. Convey that this URL is normal, just not meant for human visitors. -->
        <p class="subtitle" gettext="system:.#c680f8">这是供 AI 助手连接至我们服务器的安全通道，专为机器而非浏览器设计。</p>

        <div class="info-box">
            <!-- TRANSLATORS: Explanatory paragraph. "Secure service entrance" is a metaphor like a back door for staff - keep the <1> tag wrapping it bold. "Artificial intelligence" = AI software. "Exchange data, run searches, get things done" = the tasks the AI performs via the API. "Speaks a language only computers understand" = uses a machine protocol, not human language. Keep the tone reassuring. -->
            <p gettext="system:.#2d34c4">您可以将其视为人工智能的<strong>安全服务入口</strong>。AI 助手在此连接，以交换数据、执行搜索并自动完成任务。无需点击或查看任何内容——它使用的是只有计算机才能理解的语言。</p>
        </div>

        <!-- TRANSLATORS: Auto-redirect notice. The <1>...</1> is an animated ellipsis (three dots) - keep it at the end. This tells the visitor they will be sent to the home page automatically. -->
        <p class="redirect-note" gettext="system:.#1ffb30">正在为您跳转至主页<span class="dots">...</span></p>

        <!-- TRANSLATORS: Call-to-action button. Links to the home page. Keep it short and action-oriented. -->
        <a href="/" class="btn" gettext="system:.#dfe711">返回主页</a>
    </div>
</body>

</html>
